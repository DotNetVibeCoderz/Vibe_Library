<!-- Dibuat oleh Gravicode Studios, dipimpin oleh Kang Fadhil. -->
<!-- ActorNet package icon: actors on a cluster hash ring, messages flowing between them. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241a4f"/>
      <stop offset="1" stop-color="#0b0c22"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#6d8bff"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="core" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fff7d1"/>
      <stop offset="0.45" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <circle cx="128" cy="128" r="96" fill="url(#halo)"/>

  <!-- The hash ring, broken into segments: each arc is one node's share of the keyspace. -->
  <g fill="none" stroke="url(#ring)" stroke-width="9" stroke-linecap="round" filter="url(#glow)">
    <path d="M 128 46 A 82 82 0 0 1 199.0 87.0"/>
    <path d="M 205.1 101.7 A 82 82 0 0 1 199.0 169.0"/>
    <path d="M 186.0 186.0 A 82 82 0 0 1 128 210"/>
    <path d="M 113.8 208.8 A 82 82 0 0 1 57.0 169.0"/>
    <path d="M 50.9 154.3 A 82 82 0 0 1 57.0 87.0"/>
    <path d="M 70.0 70.0 A 82 82 0 0 1 113.8 47.2"/>
  </g>

  <!-- Messages from the central actor out to its peers. -->
  <g stroke="#8fa6ff" stroke-opacity="0.55" stroke-width="2.5" stroke-dasharray="2 6" stroke-linecap="round">
    <line x1="128" y1="128" x2="128" y2="46"/>
    <line x1="128" y1="128" x2="199" y2="169"/>
    <line x1="128" y1="128" x2="57" y2="169"/>
  </g>
  <g stroke="#fbbf24" stroke-width="3" stroke-linecap="round" filter="url(#glow)">
    <line x1="128" y1="128" x2="199" y2="87"/>
    <line x1="128" y1="128" x2="57" y2="87"/>
    <line x1="128" y1="128" x2="128" y2="210"/>
  </g>

  <!-- Actor nodes sitting on the ring. -->
  <g stroke-width="5" fill="#141236" filter="url(#glow)">
    <circle cx="128" cy="46"  r="12" stroke="#38bdf8"/>
    <circle cx="199" cy="87"  r="12" stroke="#fbbf24"/>
    <circle cx="199" cy="169" r="12" stroke="#818cf8"/>
    <circle cx="128" cy="210" r="12" stroke="#fbbf24"/>
    <circle cx="57"  cy="169" r="12" stroke="#a78bfa"/>
    <circle cx="57"  cy="87"  r="12" stroke="#fbbf24"/>
  </g>
  <g fill="#fbbf24">
    <circle cx="199" cy="87"  r="4.5"/>
    <circle cx="128" cy="210" r="4.5"/>
    <circle cx="57"  cy="87"  r="4.5"/>
  </g>

  <!-- Messages in flight. -->
  <g fill="#fff3c4" filter="url(#glow)">
    <circle cx="170" cy="104" r="4"/>
    <circle cx="128" cy="180" r="4"/>
    <circle cx="86"  cy="104" r="4"/>
  </g>

  <!-- The actor: one thread of control at the centre. -->
  <circle cx="128" cy="128" r="30" fill="#fbbf24" opacity="0.55" filter="url(#softglow)"/>
  <circle cx="128" cy="128" r="22" fill="url(#core)"/>
  <circle cx="128" cy="128" r="22" fill="none" stroke="#fff7d1" stroke-opacity="0.7" stroke-width="2"/>
  <path d="M 118 128 L 128 117 L 138 128 L 128 139 Z" fill="#1b1440" opacity="0.85"/>
</svg>
