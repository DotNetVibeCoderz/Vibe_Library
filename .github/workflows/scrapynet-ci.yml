# Build and test Scrapy.Net (Vibe_Library/ScrapyNet).
#
# Vibe_Library holds several independent projects, so this workflow is scoped by path and named
# after the one it covers. Everything runs from the ScrapyNet/ subdirectory.
name: ScrapyNet CI

on:
  push:
    branches: [main]
    paths:
      - 'ScrapyNet/**'
      - '.github/workflows/scrapynet-ci.yml'
  pull_request:
    paths:
      - 'ScrapyNet/**'
      - '.github/workflows/scrapynet-ci.yml'
  workflow_dispatch:

concurrency:
  group: scrapynet-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  TESTINGPLATFORM_TELEMETRY_OPTOUT: true

defaults:
  run:
    working-directory: ScrapyNet

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: ScrapyNet/global.json

      - name: Restore
        run: dotnet restore ScrapyNet.slnx

      - name: Build
        run: dotnet build ScrapyNet.slnx -c Release --no-restore

      # The suite is fully offline: it crawls the in-process sandbox site. The Playwright test skips
      # itself when no browser is installed; live LLM tests skip without credentials.
      - name: Test
        run: >
          dotnet run --project tests/ScrapyNet.Tests -c Release --no-build --
          --report-xunit-trx --report-xunit-trx-filename scrapynet-tests.trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scrapynet-test-results-${{ matrix.os }}
          path: ScrapyNet/tests/ScrapyNet.Tests/bin/Release/net10.0/TestResults/*.trx
          if-no-files-found: warn

  notebooks:
    name: notebooks (verify)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: ScrapyNet/global.json
      # Offline notebooks only; 01 and 03 crawl public practice sites.
      - name: Run notebook code
        run: |
          dotnet run tools/notebooks/verify/02-selectors-and-loaders.cs
          dotnet run tools/notebooks/verify/04-sandbox-practice.cs
          dotnet run tools/notebooks/verify/05-ai-rag.cs
          dotnet run tools/notebooks/verify/06-platform-jobs.cs

  pack:
    name: pack
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: ScrapyNet/global.json
      - name: Pack
        run: dotnet pack ScrapyNet.slnx -c Release -o artifacts
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: scrapynet-packages
          path: ScrapyNet/artifacts/*.nupkg

  # Redis (distributed crawling) and PostgreSQL + pgvector against real servers. Service containers
  # only run on Linux, so these tests skip themselves in the matrix above and run here.
  integration:
    name: integration (redis, pgvector)
    runs-on: ubuntu-latest
    needs: build
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: scrapynet
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      SCRAPYNET_REDIS: localhost:6379
      SCRAPYNET_PGVECTOR: Host=localhost;Username=postgres;Password=scrapynet;Database=postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: ScrapyNet/global.json
      - name: Build
        run: dotnet build tests/ScrapyNet.Tests -c Release
      - name: Redis tests
        run: dotnet run --project tests/ScrapyNet.Tests -c Release --no-build -- --filter-class '*RedisTests*'
      - name: pgvector tests
        run: dotnet run --project tests/ScrapyNet.Tests -c Release --no-build -- --filter-method '*Pgvector*'

  # A NativeAOT spider: compiles ahead of time and crawls the sandbox with generated item accessors.
  aot:
    name: native AOT
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: ScrapyNet/global.json
      - name: Publish
        run: dotnet publish samples/AotSpider -c Release -r linux-x64 -o aot
      - name: Run
        run: |
          ./aot/AotSpider | tee aot.log
          grep -q "finished" aot.log
          grep -q "Generated accessors: True" aot.log
