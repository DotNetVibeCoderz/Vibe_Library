# Build and test LVGL.Net (Vibe_Library/LVGL.Net).
#
# Vibe_Library holds several independent projects, so this workflow is scoped by path and
# named after the one it covers. Everything runs from the LVGL.Net/ subdirectory.
name: LVGL.Net CI

on:
  push:
    branches: [main]
    paths:
      - 'LVGL.Net/**'
      - '.github/workflows/lvgl-net-ci.yml'
  pull_request:
    paths:
      - 'LVGL.Net/**'
      - '.github/workflows/lvgl-net-ci.yml'
  workflow_dispatch:

concurrency:
  group: lvgl-net-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

defaults:
  run:
    working-directory: LVGL.Net

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    env:
      # The native library is built below, so an LVGL that fails to load must fail the run
      # rather than quietly skip every integration test.
      LVGLNET_REQUIRE_NATIVE: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: LVGL.Net/global.json

      # The CMake build clones LVGL itself and reuses native/lvgl when it is already there, so
      # caching that checkout keeps every run off github.com/lvgl/lvgl. The key tracks
      # CMakeLists.txt because that is where LVGL_TAG is pinned.
      - name: Cache LVGL checkout
        uses: actions/cache@v4
        with:
          path: LVGL.Net/native/lvgl
          key: lvgl-${{ hashFiles('LVGL.Net/native/CMakeLists.txt') }}

      - name: Build native library
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh ./native/build.ps1
          else
            bash ./native/build.sh
          fi

      # The designer is Avalonia now, so the whole solution builds on every OS.
      - name: Build
        run: dotnet build LVGL.Net.slnx -c Release

      # The unit tests run without the native library; with it (built above) the integration
      # tests execute against real LVGL, and the designer tests drive the real window headlessly.
      - name: Test library
        run: dotnet test tests/LVGL.Net.Tests -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Test designer
        shell: bash
        run: |
          LVGLNET_SCREENSHOTS="$PWD/artifacts/screenshots"             dotnet test tests/LVGL.Designer.Tests -c Release --no-build --logger "trx;LogFileName=designer-results.trx"

      # Frame time, allocation and memory of the Pi dashboard, rendered off-screen. Not a Pi
      # number, but a regression in the render path shows up here on every push.
      - name: Bench (headless)
        shell: bash
        run: |
          mkdir -p artifacts
          dotnet run --project samples/LVGL.Raspi -c Release --no-build --             --headless --bench 10 --report "artifacts/bench-${{ matrix.os }}.json"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lvgl-net-results-${{ matrix.os }}
          path: |
            LVGL.Net/tests/**/TestResults/*.trx
            LVGL.Net/artifacts/bench-*.json
            LVGL.Net/artifacts/screenshots/*.png
          if-no-files-found: ignore
