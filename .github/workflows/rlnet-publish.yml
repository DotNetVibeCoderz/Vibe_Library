# Packs Gravicode.RLNet and Gravicode.RLNet.Gpu and pushes them to nuget.org.
#
# The ids are prefixed because plain "RLNet" belongs to an unrelated roguelike library on
# nuget.org, and NuGet ids are case-insensitive. Assemblies and namespaces are unaffected.
#
# Trigger with a tag: RLNet-v0.1.0 (namespaced because Vibe_Library holds several projects and a
# bare v* tag would be ambiguous). A manual run without "push" ticked is a dry run: it builds,
# tests and verifies the packages and uploads them as artifacts, touching nothing public.
#
# Requires the repository secret NUGET_API_KEY.
name: RLNet Publish

on:
  push:
    tags:
      - 'RLNet-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (blank = the version in Directory.Build.props)'
        required: false
        type: string
      push:
        description: 'Push to nuget.org (leave off for a dry run)'
        required: false
        default: false
        type: boolean

concurrency:
  group: rlnet-publish
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  TESTINGPLATFORM_TELEMETRY_OPTOUT: true

defaults:
  run:
    working-directory: RLNet

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # SourceLink embeds commit information, and a shallow clone leaves it with nothing to
          # point the debugger at.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: RLNet/global.json

      # A tag is the version. Deriving it here rather than trusting Directory.Build.props means a
      # tag can never disagree with what actually gets published.
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/RLNet-v* ]]; then
            version="${GITHUB_REF#refs/tags/RLNet-v}"
          else
            version=""
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing version: ${version:-<from Directory.Build.props>}"

      - name: Build
        run: dotnet build RLNet.slnx -c Release

      # The full suite, including the learning tests that train real agents. Shipping a package
      # whose algorithms no longer learn is the one failure that matters here, and it is invisible
      # to a compile.
      - name: Test
        run: dotnet run --project tests/RLNet.Tests -c Release --no-build

      - name: Pack
        run: |
          if [ -n "${{ steps.version.outputs.value }}" ]; then
            dotnet pack RLNet.slnx -c Release --no-build -o artifacts \
              -p:Version=${{ steps.version.outputs.value }}
          else
            dotnet pack RLNet.slnx -c Release --no-build -o artifacts
          fi

      - name: List packages
        run: ls -lh artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: rlnet-nupkg
          path: RLNet/artifacts/*

      # Guarded twice over: a tag push publishes, and a manual run publishes only when "push" was
      # explicitly ticked. Everything else stops at the artifact upload above.
      - name: Push to nuget.org
        if: startsWith(github.ref, 'refs/tags/RLNet-v') || inputs.push
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
