# Build and test ActorNet (Vibe_Library/ActorNet).
#
# Vibe_Library holds several independent projects, so this workflow is scoped by path and named
# after the one it covers. Everything runs from the ActorNet/ subdirectory.
name: ActorNet CI

on:
  push:
    branches: [main]
    paths:
      - 'ActorNet/**'
      - '.github/workflows/actornet-ci.yml'
  pull_request:
    paths:
      - 'ActorNet/**'
      - '.github/workflows/actornet-ci.yml'
  workflow_dispatch:

concurrency:
  group: actornet-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  TESTINGPLATFORM_TELEMETRY_OPTOUT: true

defaults:
  run:
    working-directory: ActorNet

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # All three, because a good part of this suite is sockets and timing. The cluster tests
        # bind ephemeral ports and assert on heartbeat deadlines, and loopback behaviour under
        # load differs enough between these platforms to be worth catching here.
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: ActorNet/global.json

      - name: Restore
        run: dotnet restore ActorNet.slnx

      - name: Build
        run: dotnet build ActorNet.slnx -c Release --no-restore

      # xunit.v3 runs on Microsoft.Testing.Platform, and the .NET 10 SDK no longer bridges that
      # through VSTest - "dotnet test" fails outright. The test project is its own executable, so
      # it is run directly. --report-xunit-trx comes from xunit.v3 itself.
      - name: Test
        run: >
          dotnet run --project tests/ActorNet.Tests -c Release --no-build --
          --report-xunit-trx --report-xunit-trx-filename actornet-tests.trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actornet-test-results-${{ matrix.os }}
          path: ActorNet/tests/ActorNet.Tests/bin/Release/net10.0/TestResults/*.trx
          if-no-files-found: warn

  clients:
    name: clients
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: ActorNet/global.json

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: ActorNet/clients/go/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The Go client is the one this was written without a toolchain for, so compiling it in CI
      # is the only thing standing between it and bit-rot.
      - name: Build the Go client
        working-directory: ActorNet/clients/go
        run: |
          go vet ./...
          go build ./...

      - name: Check the Node client parses
        working-directory: ActorNet/clients/nodejs
        run: node --check actornet.js && node --check examples/banking.js

      - name: Check the Python client compiles
        working-directory: ActorNet/clients/python
        run: python -m compileall -q actornet examples

      # Each client is then run against a real node, which is the only way to catch a protocol
      # drift between them and the runtime - a parse check would not.
      - name: Start a node
        working-directory: ActorNet
        run: |
          dotnet run --project src/ActorNet.Cli -c Release -- run --port 9000 &
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/9000) 2>/dev/null; then echo "node is up"; exit 0; fi
            sleep 1
          done
          echo "the node never came up"; exit 1

      - name: Node.js client against the node
        working-directory: ActorNet
        run: node clients/nodejs/examples/banking.js

      - name: Python client against the node
        working-directory: ActorNet
        run: python clients/python/examples/telemetry.py

      - name: Go client against the node
        working-directory: ActorNet/clients/go
        run: go run ./examples/ordering

  pack:
    name: pack
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: ActorNet/global.json

      # Packing on every green build, not only on a release tag: a packaging problem that only
      # shows up at pack time is much cheaper to find here than during a release.
      - name: Pack
        run: dotnet pack ActorNet.slnx -c Release -o artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: actornet-nupkg
          path: ActorNet/artifacts/*
