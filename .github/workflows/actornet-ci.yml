# Build and test ActorNet (Vibe_Library/ActorNet).
#
# Vibe_Library holds several independent projects, so this workflow is scoped by path and named
# after the one it covers. Everything runs from the ActorNet/ subdirectory.
name: ActorNet CI

on:
  push:
    branches: [main]
    paths:
      - 'ActorNet/**'
      - '.github/workflows/actornet-ci.yml'
  pull_request:
    paths:
      - 'ActorNet/**'
      - '.github/workflows/actornet-ci.yml'
  workflow_dispatch:

concurrency:
  group: actornet-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  TESTINGPLATFORM_TELEMETRY_OPTOUT: true

defaults:
  run:
    working-directory: ActorNet

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # All three, because a good part of this suite is sockets and timing. The cluster tests
        # bind ephemeral ports and assert on heartbeat deadlines, and loopback behaviour under
        # load differs enough between these platforms to be worth catching here.
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: ActorNet/global.json

      - name: Restore
        run: dotnet restore ActorNet.slnx

      - name: Build
        run: dotnet build ActorNet.slnx -c Release --no-restore

      # xunit.v3 runs on Microsoft.Testing.Platform, and the .NET 10 SDK no longer bridges that
      # through VSTest - "dotnet test" fails outright. The test project is its own executable, so
      # it is run directly. --report-xunit-trx comes from xunit.v3 itself.
      - name: Test
        run: >
          dotnet run --project tests/ActorNet.Tests -c Release --no-build --
          --report-xunit-trx --report-xunit-trx-filename actornet-tests.trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actornet-test-results-${{ matrix.os }}
          path: ActorNet/tests/ActorNet.Tests/bin/Release/net10.0/TestResults/*.trx
          if-no-files-found: warn

  # The persistence providers, against real servers. SQLite and the two built-in stores are
  # covered by the "build" job on every platform; these four cannot be, because they need a server
  # - so without this job "PostgreSQL conforms" would be an untested claim. The conformance suite
  # self-skips when a connection string is absent, which is what makes that visible rather than
  # silently green.
  providers:
    name: providers
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: actornet
          POSTGRES_DB: actornet
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      mysql:
        image: mysql:9
        env:
          MYSQL_ROOT_PASSWORD: actornet
          MYSQL_DATABASE: actornet
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pactornet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'ActorNet!Passw0rd'
        ports: ['1433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'ActorNet!Passw0rd' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    env:
      ACTORNET_TEST_POSTGRES: 'Host=127.0.0.1;Port=5432;Database=actornet;Username=postgres;Password=actornet'
      ACTORNET_TEST_MYSQL: 'Server=127.0.0.1;Port=3306;Database=actornet;User ID=root;Password=actornet'
      ACTORNET_TEST_REDIS: '127.0.0.1:6379'
      # TrustServerCertificate because the container serves a self-signed certificate, and this is
      # a throwaway database on localhost rather than anything worth verifying a chain for.
      ACTORNET_TEST_SQLSERVER: 'Server=127.0.0.1,1433;Database=master;User ID=sa;Password=ActorNet!Passw0rd;TrustServerCertificate=True'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: ActorNet/global.json

      - name: Build
        run: dotnet build ActorNet.slnx -c Release

      # Asserted rather than assumed: if a service container failed to start, the suite would skip
      # its tests and the job would still pass, which is exactly the false green this job exists to
      # prevent.
      - name: Run the provider conformance suite
        run: >
          dotnet run --project tests/ActorNet.Tests -c Release --no-build --
          --filter-class '*ProviderTests*'
          --report-xunit-trx --report-xunit-trx-filename actornet-providers.trx

      - name: Fail if any provider suite was skipped
        shell: bash
        run: |
          trx=$(find tests/ActorNet.Tests/bin/Release/net10.0/TestResults -name 'actornet-providers.trx' | head -1)
          if [ -z "$trx" ]; then echo "no test results found"; exit 1; fi
          skipped=$(grep -o 'outcome="NotExecuted"' "$trx" | wc -l)
          if [ "$skipped" -gt 0 ]; then
            echo "$skipped provider test(s) were skipped - a service container did not come up."
            exit 1
          fi
          echo "every provider ran against a real server"

      - name: Upload provider test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actornet-provider-results
          path: ActorNet/tests/ActorNet.Tests/bin/Release/net10.0/TestResults/*.trx
          if-no-files-found: warn

  clients:
    name: clients
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: ActorNet/global.json

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: ActorNet/clients/go/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The Go client is the one this was written without a toolchain for, so compiling it in CI
      # is the only thing standing between it and bit-rot.
      - name: Build the Go client
        working-directory: ActorNet/clients/go
        run: |
          go vet ./...
          go build ./...

      - name: Check the Node client parses
        working-directory: ActorNet/clients/nodejs
        run: node --check actornet.js && node --check examples/banking.js

      - name: Check the Python client compiles
        working-directory: ActorNet/clients/python
        run: python -m compileall -q actornet examples

      # Each client is then run against a real node, which is the only way to catch a protocol
      # drift between them and the runtime - a parse check would not.
      - name: Start a node
        working-directory: ActorNet
        run: |
          dotnet run --project src/ActorNet.Cli -c Release -- run --port 9000 &
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/9000) 2>/dev/null; then echo "node is up"; exit 0; fi
            sleep 1
          done
          echo "the node never came up"; exit 1

      - name: Node.js client against the node
        working-directory: ActorNet
        run: node clients/nodejs/examples/banking.js

      - name: Python client against the node
        working-directory: ActorNet
        run: python clients/python/examples/telemetry.py

      - name: Go client against the node
        working-directory: ActorNet/clients/go
        run: go run ./examples/ordering

  pack:
    name: pack
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: ActorNet/global.json

      # Packing on every green build, not only on a release tag: a packaging problem that only
      # shows up at pack time is much cheaper to find here than during a release.
      - name: Pack
        run: dotnet pack ActorNet.slnx -c Release -o artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: actornet-nupkg
          path: ActorNet/artifacts/*
