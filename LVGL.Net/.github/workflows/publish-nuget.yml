# Packs LVGL.Net and its companion packages and pushes them to nuget.org.
#
# Triggered by a tag (v0.1.0, LVGL.Net-v0.1.0) or run by hand. A manual run without
# "push: true" is a dry run: it builds the packages and uploads them as workflow artifacts
# so the contents can be inspected before anything reaches nuget.org.
#
# Requires the repository secret NUGET_API_KEY (nuget.org -> API Keys, scoped to LVGL.Net*).
#
# On the layout of this file, see the header of ci.yml.
name: Publish NuGet

on:
  push:
    tags:
      - 'v*'
      - 'LVGL.Net-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to build (blank = the version in Directory.Build.props)'
        required: false
        type: string
      push:
        description: 'Push to nuget.org (leave off for a dry run)'
        required: false
        default: false
        type: boolean

concurrency:
  group: publish-nuget
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # One native artifact per runtime identifier. The package is only useful on a platform whose
  # lvglnet is inside it, so every RID is built before anything is packed.
  native:
    name: native (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,    os: windows-latest }
          - { rid: linux-x64,  os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-24.04-arm }
          - { rid: osx-arm64,  os: macos-latest }
          - { rid: osx-x64,    os: macos-13 }

    steps:
      - uses: actions/checkout@v4

      - name: Locate project
        id: project
        shell: bash
        run: |
          if [ -f LVGL.Net.slnx ]; then dir="."; else dir="LVGL.Net"; fi
          test -f "$dir/LVGL.Net.slnx" || { echo "LVGL.Net.slnx not found" >&2; exit 1; }
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Cache LVGL checkout
        uses: actions/cache@v4
        with:
          path: ${{ steps.project.outputs.dir }}/native/lvgl
          key: lvgl-${{ hashFiles(format('{0}/native/CMakeLists.txt', steps.project.outputs.dir)) }}

      # Demos are sample screens, not part of the wrapper's surface - they only make the
      # shipped binary larger.
      - name: Build native library
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh ./native/build.ps1 -NoDemos
          else
            ./native/build.sh --no-demos
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: ${{ steps.project.outputs.dir }}/runtimes/${{ matrix.rid }}/native/lvglnet.*
          if-no-files-found: error

  pack:
    name: pack and push
    needs: native
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Locate project
        id: project
        shell: bash
        run: |
          if [ -f LVGL.Net.slnx ]; then dir="."; else dir="LVGL.Net"; fi
          test -f "$dir/LVGL.Net.slnx" || { echo "LVGL.Net.slnx not found" >&2; exit 1; }
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: ${{ steps.project.outputs.dir }}/global.json

      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: ${{ runner.temp }}/native

      # download-artifact writes one native-<rid> folder per job; put each payload back at
      # runtimes/<rid>/native, exactly where LVGL.Net.csproj globs for it.
      - name: Stage native artifacts
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          for d in "${{ runner.temp }}"/native/native-*; do
            rid="${d##*/native-}"
            mkdir -p "runtimes/$rid/native"
            cp "$d"/lvglnet.* "runtimes/$rid/native/"
          done
          find runtimes -type f -name 'lvglnet.*' -print

      # A tag sets the version; otherwise the workflow input wins; otherwise the
      # Directory.Build.props value is used unchanged.
      - name: Resolve version
        id: version
        shell: bash
        run: |
          v="${{ inputs.version }}"
          if [ -z "$v" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            v="${GITHUB_REF_NAME#LVGL.Net-}"
            v="${v#v}"
          fi
          if [ -n "$v" ]; then echo "arg=-p:Version=$v" >> "$GITHUB_OUTPUT"; else echo "arg=" >> "$GITHUB_OUTPUT"; fi
          echo "version=${v:-<from Directory.Build.props>}" >> "$GITHUB_OUTPUT"

      - name: Pack
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          for p in src/LVGL.Net src/LVGL.Net.Ui src/LVGL.Net.Sdl src/LVGL.Net.Linux src/LVGL.Net.Assistant; do
            dotnet pack "$p" -c Release -o artifacts/nuget ${{ steps.version.outputs.arg }}
          done
          ls -l artifacts/nuget

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ${{ steps.project.outputs.dir }}/artifacts/nuget/*
          if-no-files-found: error

      # --skip-duplicate so re-running a release job over an already-published version is a
      # no-op rather than a failure.
      - name: Push to nuget.org
        if: github.event_name == 'push' || inputs.push
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::NUGET_API_KEY is not set - add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          dotnet nuget push "artifacts/nuget/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
