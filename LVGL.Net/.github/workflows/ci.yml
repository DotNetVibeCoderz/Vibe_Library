# Build and test LVGL.Net.
#
# This project is designed to sit either at the root of its own repository or as the
# LVGL.Net/ subfolder of DotNetVibeCoderz/Vibe_Library. GitHub only runs workflows found in
# .github/workflows at the *repository* root, so when this folder is vendored into
# Vibe_Library the .github directory moves up with it; the "Locate project" step below then
# finds the sources either way, and every later step runs from that directory.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Locate project
        id: project
        shell: bash
        run: |
          if [ -f LVGL.Net.slnx ]; then dir="."; else dir="LVGL.Net"; fi
          test -f "$dir/LVGL.Net.slnx" || { echo "LVGL.Net.slnx not found" >&2; exit 1; }
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: ${{ steps.project.outputs.dir }}/global.json

      # The CMake build clones LVGL itself and reuses native/lvgl when it is already there,
      # so caching the checkout keeps every run off github.com/lvgl/lvgl. The key tracks
      # CMakeLists.txt because that is where LVGL_TAG is pinned.
      - name: Cache LVGL checkout
        uses: actions/cache@v4
        with:
          path: ${{ steps.project.outputs.dir }}/native/lvgl
          key: lvgl-${{ hashFiles(format('{0}/native/CMakeLists.txt', steps.project.outputs.dir)) }}

      - name: Build native library (Linux)
        if: runner.os == 'Linux'
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./native/build.sh --no-demos

      - name: Build native library (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ steps.project.outputs.dir }}
        shell: pwsh
        run: ./native/build.ps1 -NoDemos

      # The WPF designer targets net10.0-windows and cannot even be restored on Linux, so the
      # whole solution is only built on Windows. Everything else is cross-platform.
      - name: Build (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ steps.project.outputs.dir }}
        run: dotnet build LVGL.Net.slnx -c Release

      - name: Build (Linux)
        if: runner.os == 'Linux'
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          for p in src/LVGL.Net src/LVGL.Net.Ui src/LVGL.Net.Sdl src/LVGL.Net.Linux \
                   src/LVGL.Net.Assistant samples/LVGL.Desktop samples/LVGL.Raspi \
                   tests/LVGL.Net.Tests; do
            dotnet build "$p" -c Release
          done

      # The unit tests run without the native library and LvglIntegrationTests no-ops when it is
      # missing, so this passes either way - but the native build above means the integration
      # tests actually execute here.
      - name: Test
        working-directory: ${{ steps.project.outputs.dir }}
        run: dotnet test tests/LVGL.Net.Tests -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: ${{ steps.project.outputs.dir }}/tests/LVGL.Net.Tests/TestResults/*.trx
          if-no-files-found: ignore
